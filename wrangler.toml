# Cloudflare Pages / Workers configuration for the Baby Seven portfolio.
#
# Generated by the Cloudflare migration plan. See MIGRATION.md for the full
# deployment walkthrough.

name = "baby-seven-portfolio"
compatibility_date = "2026-01-31"

# Prisma's edge-runtime client uses `node:buffer` and `node:async_hooks`.
# Without nodejs_compat, the Worker throws runtime errors on the first
# API request. Cloudflare's own deploy log warns about this — we're
# silencing that warning here by enabling the flag explicitly.
compatibility_flags = ["nodejs_compat"]

# Required for `npx wrangler pages deploy` to recognize this as a Cloudflare
# Pages project and know where the built assets live. The `bun run pages:build`
# script (which runs `@cloudflare/next-on-pages`) produces this directory.
#
# Note: do NOT add an `[assets]` block — that makes wrangler treat this as a
# Cloudflare Workers project (not Pages) and triggers a security warning about
# uploading _worker.js as a public asset. For Pages, `pages_build_output_dir`
# is the correct directive.
pages_build_output_dir = ".vercel/output/static"

[vars]
ENVIRONMENT = "production"
NEXT_PUBLIC_SITE_URL = "https://baby-seven.pages.dev"

# ---------------------------------------------------------------------------
# Cloudflare D1 database binding — CURRENTLY DISABLED
# ---------------------------------------------------------------------------
# The D1 binding is commented out so the Function can deploy without a real
# D1 database. This means:
#   ✅ The static site deploys and works fully (homepage, hero, theme toggle,
#      Portfolio, Collaborate forms, Support maintenance page, etc.)
#   ❌ The API routes (/api/stats, /api/projects, /api/editors, /api/notify,
#      /api/collaborate, /api/testimonials, /api/collaborations) will return
#      errors at runtime because there's no database binding.
#
# To enable the API routes (full functionality):
#   1. Create a D1 database:
#        npx wrangler d1 create baby-seven-db
#   2. Copy the printed database_id and paste it below (replace the placeholder).
#   3. Uncomment the [[d1_databases]] block.
#   4. Apply the schema + seed:
#        npx wrangler d1 execute baby-seven-db --remote --file=prisma/migrations-d1/0001_init.sql
#        npx wrangler d1 execute baby-seven-db --remote --file=prisma/migrations-d1/0002_seed.sql
#   5. Commit + push. The next deploy will include the D1 binding.
# ---------------------------------------------------------------------------
# [[d1_databases]]
# binding = "DB"
# database_name = "baby-seven-db"
# database_id = "REPLACE_WITH_D1_DATABASE_ID_FROM_WRANGLER_CREATE"
# migrations_dir = "prisma/migrations-d1"

# The DATABASE_URL secret is set via the Wrangler CLI (it never lives in this file):
#   npx wrangler secret put DATABASE_URL
# In edge mode it's only used as a fallback hint; the D1 binding above is the
# actual connection.
